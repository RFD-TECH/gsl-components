<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSL Components</title>
    <script>
      (function() {
        // Must read the same key ThemeProvider writes, or the first paint is
        // the OS theme and hydration flips it: a white flash on every reload.
        // "gsl-theme" is the pre-rebrand key, kept for anyone who still has it.
        var stored = localStorage.getItem("clet-theme") || localStorage.getItem("gsl-theme");
        var theme;
        if (stored === "dark" || stored === "light") {
          theme = stored;
        } else {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-clet-theme", theme);
        document.documentElement.setAttribute("data-gsl-theme", theme);

        // Same reasoning for the accessibility text size: without this the first
        // paint is Normal and the effect resizes every glyph a frame later.
        var storedSize = localStorage.getItem("clet-font-size") || localStorage.getItem("gsl-font-size");
        var fontSize = ["sm", "md", "lg", "xl"].indexOf(storedSize) === -1 ? "md" : storedSize;
        document.documentElement.setAttribute("data-clet-font-size", fontSize);
        document.documentElement.setAttribute("data-gsl-font-size", fontSize);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
